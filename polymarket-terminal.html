<div id="root"><div id="boot"><b>Polymarket Terminal</b><span>Стартирам…  Ако този екран остане повече от 15 секунди, браузърът не е успял да зареди React от CDN — провери интернет връзката.</span></div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   POLYMARKET TERMINAL
   API 1: Gamma  (https://gamma-api.polymarket.com)  - market universe
   API 2: CLOB   (https://clob.polymarket.com)       - price history / book
   API 3: Binance(https://api.binance.com)           - spot + realised vol
   No keys required. All endpoints are public + CORS enabled.
   ============================================================ */

const GAMMA = "https://gamma-api.polymarket.com";
const CLOB = "https://clob.polymarket.com";
const BINANCE = "https://api.binance.com";

/* ---------- palette ---------- */
const C = {
  bg: "#0A0A0B",
  panel: "#121316",
  panel2: "#17181C",
  rule: "#26272B",
  amber: "#FFA028",
  cyan: "#4CC9F0",
  green: "#26C281",
  red: "#F04B4B",
  text: "#E6E7EA",
  mute: "#83868E",
  dim: "#5A5D65",
};
const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

/* ---------- math ---------- */
const ncdf = (x) => {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989422804014327 * Math.exp((-x * x) / 2);
  const p =
    d * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x > 0 ? 1 - p : p;
};

const ema = (arr, n) => {
  if (!arr.length) return [];
  const k = 2 / (n + 1);
  const out = [arr[0]];
  for (let i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i - 1] * (1 - k));
  return out;
};

const rsi = (arr, n = 14) => {
  if (arr.length < n + 1) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) {
    const d = arr[i] - arr[i - 1];
    if (d > 0) g += d; else l -= d;
  }
  g /= n; l /= n;
  for (let i = n + 1; i < arr.length; i++) {
    const d = arr[i] - arr[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
  }
  if (l === 0) return 100;
  return 100 - 100 / (1 + g / l);
};

const stdev = (a) => {
  if (a.length < 2) return 0;
  const m = a.reduce((s, x) => s + x, 0) / a.length;
  return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
};

/* ---------- formatting ---------- */
const pct = (x, d = 1) => (x == null || !isFinite(x) ? "—" : (x * 100).toFixed(d) + "%");
const usd = (x) => {
  if (x == null || !isFinite(x)) return "—";
  const a = Math.abs(x);
  if (a >= 1e9) return "$" + (x / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return "$" + (x / 1e3).toFixed(1) + "K";
  return "$" + x.toFixed(0);
};
const px = (x) => (x == null || !isFinite(x) ? "—" : x >= 1000 ? x.toLocaleString(undefined, { maximumFractionDigits: 0 }) : x.toFixed(x < 1 ? 4 : 2));
const jparse = (v, f) => {
  if (v == null) return f;
  if (Array.isArray(v)) return v;
  try { return JSON.parse(v); } catch { return f; }
};

/* ---------- crypto market parsing ---------- */
const ASSETS = [
  { re: /\b(bitcoin|btc)\b/i, sym: "BTCUSDT", tag: "BTC" },
  { re: /\b(ethereum|ether|eth)\b/i, sym: "ETHUSDT", tag: "ETH" },
  { re: /\b(solana|sol)\b/i, sym: "SOLUSDT", tag: "SOL" },
  { re: /\b(xrp|ripple)\b/i, sym: "XRPUSDT", tag: "XRP" },
  { re: /\b(dogecoin|doge)\b/i, sym: "DOGEUSDT", tag: "DOGE" },
  { re: /\b(binance coin|bnb)\b/i, sym: "BNBUSDT", tag: "BNB" },
  { re: /\b(cardano|ada)\b/i, sym: "ADAUSDT", tag: "ADA" },
  { re: /\b(chainlink|link)\b/i, sym: "LINKUSDT", tag: "LINK" },
];
const CRYPTO_RE = /\b(bitcoin|btc|ethereum|eth|solana|sol|xrp|ripple|doge|dogecoin|crypto|bnb|cardano|ada|chainlink|link|altcoin|stablecoin|etf)\b/i;

const detectAsset = (q) => ASSETS.find((a) => a.re.test(q)) || null;

const parseTarget = (q) => {
  const s = q.replace(/,/g, "");
  const m = s.match(/\$\s?(\d+(?:\.\d+)?)\s*([kKmM])?/);
  if (!m) return null;
  let v = parseFloat(m[1]);
  const suf = (m[2] || "").toLowerCase();
  if (suf === "k") v *= 1e3;
  if (suf === "m") v *= 1e6;
  return v;
};
const isBelow = (q) => /\b(below|under|dip|drop|fall|less than|down to|crash)\b/i.test(q);
const isTouch = (q) => /\b(reach|hit|touch|dip to|all[- ]?time high|ath|new high|any time|anytime)\b/i.test(q);

/* Digital option probabilities under driftless GBM (risk-neutral, r=0) */
function terminalProb(S, K, sigma, T, below) {
  if (!(S > 0 && K > 0 && sigma > 0 && T > 0)) return null;
  const d2 = (Math.log(S / K) - 0.5 * sigma * sigma * T) / (sigma * Math.sqrt(T));
  const above = ncdf(d2);
  return below ? 1 - above : above;
}
function touchProb(S, K, sigma, T) {
  if (!(S > 0 && K > 0 && sigma > 0 && T > 0)) return null;
  const b = Math.log(K / S);
  const m = -0.5 * sigma * sigma;
  const v = sigma * Math.sqrt(T);
  if (b > 0) {
    return ncdf((-b + m * T) / v) + Math.exp((2 * m * b) / (sigma * sigma)) * ncdf((-b - m * T) / v);
  }
  const bb = -b;
  return ncdf((-bb - m * T) / v) + Math.exp((-2 * m * bb) / (sigma * sigma)) * ncdf((-bb + m * T) / v);
}

/* ---------- fetch layer ---------- */
async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url.split("?")[0].split("/").slice(-1)[0]}`);
  return r.json();
}

/* ---------- candle aggregation ---------- */
function toCandles(points, bucketSec) {
  const map = new Map();
  for (const p of points) {
    const b = Math.floor(p.t / bucketSec) * bucketSec;
    const c = map.get(b);
    if (!c) map.set(b, { t: b, o: p.p, h: p.p, l: p.p, c: p.p });
    else { c.h = Math.max(c.h, p.p); c.l = Math.min(c.l, p.p); c.c = p.p; }
  }
  return [...map.values()].sort((a, b) => a.t - b.t);
}

/* ============================================================ */

function PolymarketTerminal() {
  const [tab, setTab] = useState("crypto");
  const [markets, setMarkets] = useState([]);
  const [spot, setSpot] = useState({});          // sym -> {price, sig, sigFast, chg24}
  const [status, setStatus] = useState({ gamma: "idle", clob: "idle", binance: "idle" });
  const [err, setErr] = useState(null);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const [minLiq, setMinLiq] = useState(2000);
  const [sortKey, setSortKey] = useState("vol");
  const [sel, setSel] = useState(null);
  const [hist, setHist] = useState({ loading: false, candles: [], err: null });
  const [now, setNow] = useState(Date.now());
  const [lastSync, setLastSync] = useState(null);
  const [auto, setAuto] = useState(true);
  const mounted = useRef(true);

  useEffect(() => () => { mounted.current = false; }, []);
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);

  /* ---- load market universe ---- */
  const loadMarkets = useCallback(async () => {
    setStatus((s) => ({ ...s, gamma: "live" }));
    try {
      const chunks = await Promise.all([0, 500].map((off) =>
        jget(`${GAMMA}/markets?active=true&closed=false&archived=false&limit=500&offset=${off}&order=volume24hr&ascending=false`)
      ));
      const raw = [].concat(...chunks.map((c) => (Array.isArray(c) ? c : c?.data || [])));
      const rows = raw.map((m) => {
        const prices = jparse(m.outcomePrices, []).map(Number);
        const outs = jparse(m.outcomes, ["Yes", "No"]);
        const toks = jparse(m.clobTokenIds, []);
        const yi = Math.max(0, outs.findIndex((o) => /yes/i.test(o)));
        const p = Number(prices[yi === -1 ? 0 : yi]);
        const end = m.endDate ? new Date(m.endDate).getTime() : null;
        return {
          id: m.id,
          q: m.question || m.title || "",
          slug: m.slug,
          p: isFinite(p) ? p : null,
          outs,
          token: toks[yi === -1 ? 0 : yi],
          vol24: Number(m.volume24hr) || 0,
          vol: Number(m.volumeNum ?? m.volume) || 0,
          liq: Number(m.liquidityNum ?? m.liquidity) || 0,
          bid: Number(m.bestBid),
          ask: Number(m.bestAsk),
          spread: Number(m.spread),
          c1h: Number(m.oneHourPriceChange),
          c24h: Number(m.oneDayPriceChange),
          c1w: Number(m.oneWeekPriceChange),
          end,
        };
      }).filter((r) => r.p != null && r.p > 0.005 && r.p < 0.995 && r.q);

      const uniq = new Map();
      rows.forEach((r) => { if (!uniq.has(r.id)) uniq.set(r.id, r); });
      const list = [...uniq.values()];
      if (!mounted.current) return;
      setMarkets(list);
      setStatus((s) => ({ ...s, gamma: "ok" }));
      setLastSync(Date.now());
      setErr(null);
      return list;
    } catch (e) {
      if (!mounted.current) return;
      setStatus((s) => ({ ...s, gamma: "fail" }));
      setErr(`Gamma API не отговори: ${e.message}. Провери мрежата и натисни SYNC.`);
      return [];
    } finally {
      if (mounted.current) setLoading(false);
    }
  }, []);

  /* ---- load spot + realised vol from Binance ---- */
  const loadSpot = useCallback(async (list) => {
    const syms = [...new Set((list || []).map((m) => detectAsset(m.q)?.sym).filter(Boolean))].slice(0, 8);
    if (!syms.length) return;
    setStatus((s) => ({ ...s, binance: "live" }));
    const out = {};
    let ok = 0;
    await Promise.all(syms.map(async (sym) => {
      try {
        const k = await jget(`${BINANCE}/api/v3/klines?symbol=${sym}&interval=4h&limit=200`);
        const cl = k.map((x) => Number(x[4]));
        const rets = cl.slice(1).map((c, i) => Math.log(c / cl[i]));
        const bpy = (365 * 24) / 4;
        const sig = stdev(rets) * Math.sqrt(bpy);
        const sigFast = stdev(rets.slice(-42)) * Math.sqrt(bpy);
        const price = cl[cl.length - 1];
        const chg24 = cl.length > 6 ? price / cl[cl.length - 7] - 1 : null;
        out[sym] = { price, sig, sigFast, chg24, closes: cl };
        ok++;
      } catch { /* leave missing */ }
    }));
    if (!mounted.current) return;
    setSpot((s) => ({ ...s, ...out }));
    setStatus((s) => ({ ...s, binance: ok ? "ok" : "fail" }));
  }, []);

  const sync = useCallback(async () => {
    const list = await loadMarkets();
    if (list && list.length) loadSpot(list);
  }, [loadMarkets, loadSpot]);

  useEffect(() => { sync(); }, [sync]);
  useEffect(() => {
    if (!auto) return;
    const i = setInterval(sync, 90000);
    return () => clearInterval(i);
  }, [auto, sync]);

  /* ---- enrich with model ---- */
  const enriched = useMemo(() => {
    return markets.map((m) => {
      const a = detectAsset(m.q);
      const isC = CRYPTO_RE.test(m.q);
      let model = null, modelTouch = null, sigma = null, S = null, K = null, T = null, kind = null;
      if (a && spot[a.sym] && m.end) {
        K = parseTarget(m.q);
        S = spot[a.sym].price;
        sigma = 0.6 * spot[a.sym].sigFast + 0.4 * spot[a.sym].sig;
        T = (m.end - Date.now()) / (365 * 864e5);
        if (K && T > 0 && sigma > 0) {
          const below = isBelow(m.q);
          kind = isTouch(m.q) ? "touch" : "terminal";
          model = terminalProb(S, K, sigma, T, below);
          const tp = touchProb(S, K, sigma, T);
          modelTouch = below ? tp : tp;
          if (kind === "touch") model = below ? tp : tp;
        }
      }
      const edge = model != null ? model - m.p : null;
      const kelly = model != null ? (edge > 0 ? (model - m.p) / (1 - m.p) : (m.p - model) / m.p) : null;
      const ev = model != null ? (edge > 0 ? model / m.p - 1 : (1 - model) / (1 - m.p) - 1) : null;
      const days = m.end ? (m.end - Date.now()) / 864e5 : null;
      return { ...m, asset: a?.tag || null, sym: a?.sym || null, isCrypto: isC, model, modelTouch, kind, sigma, S, K, T, edge, kelly, ev, days };
    });
  }, [markets, spot]);

  /* ---- signal engine ---- */
  const signal = useCallback((m) => {
    const reasons = [];
    let score = 0;
    if (m.edge != null) {
      const e = m.edge;
      if (Math.abs(e) >= 0.03) {
        score += Math.sign(e) * Math.min(3, Math.abs(e) / 0.05);
        reasons.push(`Модел ${pct(m.model)} срещу пазар ${pct(m.p)} → edge ${(e * 100).toFixed(1)}pp`);
      } else reasons.push("Моделът е близо до пазара — няма ценово предимство");
    }
    const mo = isFinite(m.c24h) ? m.c24h : 0;
    if (Math.abs(mo) >= 0.03) {
      score += Math.sign(mo) * 0.6;
      reasons.push(`24ч моментум ${(mo * 100).toFixed(1)}pp`);
    }
    if (isFinite(m.spread) && m.spread > 0.04) { score *= 0.6; reasons.push(`Широк спред ${(m.spread * 100).toFixed(1)}pp — изпълнението яде edge-а`); }
    if (m.liq < 5000) { score *= 0.6; reasons.push(`Ниска ликвидност ${usd(m.liq)} — трудно излизане`); }
    if (m.days != null && m.days < 1.5) { score *= 0.7; reasons.push("Под 36ч до сетълмент — гама риск"); }
    let side = "NEUTRAL";
    if (score >= 1.0) side = "BUY YES";
    else if (score <= -1.0) side = "BUY NO";
    const conf = Math.min(100, Math.round(Math.abs(score) * 33));
    return { side, score, conf, reasons };
  }, []);

  /* ---- views ---- */
  const cryptoRows = useMemo(() => {
    let r = enriched.filter((m) => m.isCrypto && m.liq >= minLiq);
    if (q) r = r.filter((m) => m.q.toLowerCase().includes(q.toLowerCase()));
    return sortRows(r, sortKey);
  }, [enriched, q, minLiq, sortKey]);

  const dailyRows = useMemo(() => {
    let r = enriched.filter((m) => m.liq >= minLiq);
    if (q) r = r.filter((m) => m.q.toLowerCase().includes(q.toLowerCase()));
    return sortRows(r, sortKey);
  }, [enriched, q, minLiq, sortKey]);

  function sortRows(r, k) {
    const c = [...r];
    if (k === "vol") c.sort((a, b) => b.vol24 - a.vol24);
    if (k === "edge") c.sort((a, b) => Math.abs(b.edge ?? 0) - Math.abs(a.edge ?? 0));
    if (k === "move") c.sort((a, b) => Math.abs(b.c24h ?? 0) - Math.abs(a.c24h ?? 0));
    if (k === "liq") c.sort((a, b) => b.liq - a.liq);
    if (k === "exp") c.sort((a, b) => (a.days ?? 1e9) - (b.days ?? 1e9));
    return c;
  }

  /* ---- history for selected ---- */
  useEffect(() => {
    if (!sel?.token) { setHist({ loading: false, candles: [], err: null }); return; }
    let dead = false;
    setHist({ loading: true, candles: [], err: null });
    setStatus((s) => ({ ...s, clob: "live" }));
    const tf = tab === "crypto" ? "4h" : "1d";
    const interval = tf === "4h" ? "1w" : "1m";
    (async () => {
      try {
        const d = await jget(`${CLOB}/prices-history?market=${sel.token}&interval=${interval}&fidelity=60`);
        const pts = (d?.history || []).map((h) => ({ t: Number(h.t), p: Number(h.p) })).filter((h) => isFinite(h.p));
        if (dead) return;
        const bucket = tf === "4h" ? 4 * 3600 : 86400;
        setHist({ loading: false, candles: toCandles(pts, bucket), err: null });
        setStatus((s) => ({ ...s, clob: pts.length ? "ok" : "fail" }));
      } catch (e) {
        if (dead) return;
        setHist({ loading: false, candles: [], err: e.message });
        setStatus((s) => ({ ...s, clob: "fail" }));
      }
    })();
    return () => { dead = true; };
  }, [sel, tab]);

  const rows = tab === "crypto" ? cryptoRows : dailyRows;

  return (
    <div style={{ background: C.bg, color: C.text, fontFamily: MONO, minHeight: "100vh", fontSize: 12, letterSpacing: "-0.01em" }}>
      <Header now={now} status={status} lastSync={lastSync} auto={auto} setAuto={setAuto} onSync={sync} />

      <div className="flex" style={{ borderBottom: `1px solid ${C.rule}` }}>
        {[
          ["crypto", "CRYPTO · 4H"],
          ["daily", "ВСИЧКО · DAILY"],
        ].map(([k, l]) => (
          <button key={k} onClick={() => { setTab(k); setSel(null); }}
            style={{ flex: 1, padding: "9px 0", background: tab === k ? C.panel2 : "transparent", color: tab === k ? C.amber : C.mute, border: "none", borderBottom: tab === k ? `2px solid ${C.amber}` : "2px solid transparent", fontFamily: MONO, fontSize: 11, fontWeight: 600 }}>
            {l}
          </button>
        ))}
      </div>

      <Controls q={q} setQ={setQ} minLiq={minLiq} setMinLiq={setMinLiq} sortKey={sortKey} setSortKey={setSortKey} count={rows.length} />

      {err && <div style={{ background: "#2A1414", color: C.red, padding: "8px 10px", fontSize: 11, borderBottom: `1px solid ${C.rule}` }}>{err}</div>}

      {loading ? (
        <div style={{ padding: 40, textAlign: "center", color: C.mute }}>Зареждам пазарите…</div>
      ) : rows.length === 0 ? (
        <div style={{ padding: 30, textAlign: "center", color: C.mute, fontSize: 11 }}>
          Няма пазари при тези филтри. Свали прага за ликвидност или изчисти търсенето.
        </div>
      ) : (
        <MarketTable rows={rows} tab={tab} signal={signal} onPick={setSel} sel={sel} />
      )}

      {sel && <DetailSheet m={enriched.find((x) => x.id === sel.id) || sel} hist={hist} tab={tab} sig={signal(enriched.find((x) => x.id === sel.id) || sel)} onClose={() => setSel(null)} spot={spot} />}

      <div style={{ padding: "14px 10px 28px", color: C.dim, fontSize: 10, lineHeight: 1.6, borderTop: `1px solid ${C.rule}` }}>
        Моделът оценява вероятност по геометрично броуново движение с нулев дрейф и реализирана волатилност от Binance 4H (60% къс прозорец / 40% дълъг). Той не знае за новини, регулация или манипулация на оракула. Използвай edge-а като хипотеза за проверка, не като сигнал за автоматично изпълнение. Това не е финансов съвет.
      </div>
    </div>
  );
}

/* ============================================================ */

function Header({ now, status, lastSync, auto, setAuto, onSync }) {
  const dot = (s) => (s === "ok" ? C.green : s === "fail" ? C.red : s === "live" ? C.amber : C.dim);
  const t = new Date(now);
  return (
    <div style={{ background: C.panel, borderBottom: `1px solid ${C.rule}`, padding: "8px 10px" }}>
      <div className="flex items-baseline justify-between">
        <div style={{ color: C.amber, fontWeight: 700, fontSize: 13, letterSpacing: "0.06em" }}>POLYMARKET TERMINAL</div>
        <div style={{ color: C.mute, fontSize: 11 }}>{t.toUTCString().slice(17, 25)} UTC</div>
      </div>
      <div className="flex items-center justify-between" style={{ marginTop: 6 }}>
        <div className="flex items-center" style={{ gap: 10, fontSize: 10, color: C.mute }}>
          {[["GAMMA", status.gamma], ["CLOB", status.clob], ["BINANCE", status.binance]].map(([l, s]) => (
            <span key={l} className="flex items-center" style={{ gap: 4 }}>
              <span style={{ width: 6, height: 6, borderRadius: 3, background: dot(s), display: "inline-block" }} />{l}
            </span>
          ))}
        </div>
        <div className="flex items-center" style={{ gap: 6 }}>
          <button onClick={() => setAuto(!auto)}
            style={{ background: "transparent", border: `1px solid ${auto ? C.green : C.rule}`, color: auto ? C.green : C.mute, fontSize: 10, padding: "3px 6px", fontFamily: MONO }}>
            AUTO 90s
          </button>
          <button onClick={onSync}
            style={{ background: C.amber, border: "none", color: "#111", fontSize: 10, fontWeight: 700, padding: "3px 9px", fontFamily: MONO }}>
            SYNC
          </button>
        </div>
      </div>
      {lastSync && <div style={{ color: C.dim, fontSize: 10, marginTop: 4 }}>Последно обновяване {Math.round((now - lastSync) / 1000)}s назад</div>}
    </div>
  );
}

function Controls({ q, setQ, minLiq, setMinLiq, sortKey, setSortKey, count }) {
  return (
    <div style={{ background: C.panel2, borderBottom: `1px solid ${C.rule}`, padding: "7px 10px" }}>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Търси пазар…"
        style={{ width: "100%", background: C.bg, border: `1px solid ${C.rule}`, color: C.text, padding: "6px 8px", fontFamily: MONO, fontSize: 11, outline: "none" }} />
      <div className="flex items-center justify-between" style={{ marginTop: 6, gap: 8 }}>
        <div className="flex" style={{ gap: 4 }}>
          {[["vol", "ОБОРОТ"], ["edge", "EDGE"], ["move", "ДВИЖ"], ["liq", "ЛИКВ"], ["exp", "СРОК"]].map(([k, l]) => (
            <button key={k} onClick={() => setSortKey(k)}
              style={{ background: sortKey === k ? C.amber : "transparent", color: sortKey === k ? "#111" : C.mute, border: `1px solid ${sortKey === k ? C.amber : C.rule}`, fontSize: 9, padding: "2px 5px", fontFamily: MONO, fontWeight: 600 }}>
              {l}
            </button>
          ))}
        </div>
        <select value={minLiq} onChange={(e) => setMinLiq(Number(e.target.value))}
          style={{ background: C.bg, color: C.mute, border: `1px solid ${C.rule}`, fontSize: 9, fontFamily: MONO, padding: "2px 3px" }}>
          <option value={0}>ликв 0+</option>
          <option value={2000}>2K+</option>
          <option value={10000}>10K+</option>
          <option value={50000}>50K+</option>
        </select>
      </div>
      <div style={{ color: C.dim, fontSize: 10, marginTop: 5 }}>{count} пазара</div>
    </div>
  );
}

function MarketTable({ rows, tab, signal, onPick, sel }) {
  return (
    <div>
      <div className="flex" style={{ background: C.panel, borderBottom: `1px solid ${C.rule}`, padding: "5px 10px", fontSize: 9, color: C.dim, fontWeight: 600 }}>
        <div style={{ flex: 1 }}>ПАЗАР</div>
        <div style={{ width: 44, textAlign: "right" }}>YES</div>
        <div style={{ width: 44, textAlign: "right" }}>{tab === "crypto" ? "1Ч" : "24Ч"}</div>
        <div style={{ width: 46, textAlign: "right" }}>МОДЕЛ</div>
        <div style={{ width: 46, textAlign: "right" }}>EDGE</div>
      </div>
      {rows.slice(0, 120).map((m) => {
        const s = signal(m);
        const chg = tab === "crypto" ? m.c1h : m.c24h;
        const on = sel?.id === m.id;
        return (
          <button key={m.id} onClick={() => onPick(m)}
            style={{ display: "block", width: "100%", textAlign: "left", background: on ? C.panel2 : "transparent", border: "none", borderBottom: `1px solid ${C.rule}`, padding: "7px 10px", fontFamily: MONO, color: C.text }}>
            <div className="flex items-start">
              <div style={{ flex: 1, paddingRight: 6 }}>
                <div style={{ fontSize: 11, lineHeight: 1.35 }}>{m.q.length > 78 ? m.q.slice(0, 78) + "…" : m.q}</div>
                <div className="flex items-center" style={{ gap: 6, marginTop: 3, fontSize: 9, color: C.dim }}>
                  {m.asset && <span style={{ color: C.cyan }}>{m.asset}</span>}
                  <span>{usd(m.vol24)}/24ч</span>
                  <span>ликв {usd(m.liq)}</span>
                  {m.days != null && <span>{m.days < 1 ? Math.round(m.days * 24) + "ч" : Math.round(m.days) + "д"}</span>}
                  {s.side !== "NEUTRAL" && (
                    <span style={{ color: s.side === "BUY YES" ? C.green : C.red, fontWeight: 700 }}>{s.side}</span>
                  )}
                </div>
              </div>
              <div style={{ width: 44, textAlign: "right", fontSize: 12, fontWeight: 700, color: C.amber }}>{(m.p * 100).toFixed(0)}¢</div>
              <div style={{ width: 44, textAlign: "right", fontSize: 11, color: !isFinite(chg) || chg === 0 ? C.dim : chg > 0 ? C.green : C.red }}>
                {isFinite(chg) ? (chg > 0 ? "+" : "") + (chg * 100).toFixed(1) : "—"}
              </div>
              <div style={{ width: 46, textAlign: "right", fontSize: 11, color: m.model != null ? C.cyan : C.dim }}>
                {m.model != null ? (m.model * 100).toFixed(0) + "¢" : "—"}
              </div>
              <div style={{ width: 46, textAlign: "right", fontSize: 11, fontWeight: 700, color: m.edge == null ? C.dim : m.edge > 0.02 ? C.green : m.edge < -0.02 ? C.red : C.mute }}>
                {m.edge != null ? (m.edge > 0 ? "+" : "") + (m.edge * 100).toFixed(1) : "—"}
              </div>
            </div>
          </button>
        );
      })}
    </div>
  );
}

/* ---------- detail ---------- */
function DetailSheet({ m, hist, tab, sig, onClose, spot }) {
  const closes = hist.candles.map((c) => c.c);
  const e9 = ema(closes, 9), e21 = ema(closes, 21);
  const r = rsi(closes, 14);
  const trend = e9.length && e21.length ? (e9[e9.length - 1] > e21[e21.length - 1] ? "UP" : "DOWN") : null;
  const s = m.sym ? spot[m.sym] : null;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 50, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}
        style={{ background: C.bg, width: "100%", maxHeight: "92vh", overflowY: "auto", borderTop: `2px solid ${C.amber}`, fontFamily: MONO }}>
        <div style={{ position: "sticky", top: 0, background: C.panel, borderBottom: `1px solid ${C.rule}`, padding: "9px 10px" }}>
          <div className="flex items-start justify-between" style={{ gap: 8 }}>
            <div style={{ fontSize: 11, lineHeight: 1.4, flex: 1, color: C.text }}>{m.q}</div>
            <button onClick={onClose} style={{ background: "transparent", border: `1px solid ${C.rule}`, color: C.mute, fontSize: 11, padding: "2px 7px", fontFamily: MONO }}>✕</button>
          </div>
        </div>

        <Row3 a={["YES", (m.p * 100).toFixed(1) + "¢", C.amber]} b={["NO", ((1 - m.p) * 100).toFixed(1) + "¢", C.text]} c={["СПРЕД", isFinite(m.spread) ? (m.spread * 100).toFixed(1) + "pp" : "—", m.spread > 0.04 ? C.red : C.text]} />
        <Row3 a={["ОБОРОТ 24Ч", usd(m.vol24), C.text]} b={["ЛИКВИДНОСТ", usd(m.liq), m.liq < 5000 ? C.red : C.text]} c={["ДО СЕТЪЛМЕНТ", m.days != null ? (m.days < 1 ? Math.round(m.days * 24) + "ч" : Math.round(m.days) + "д") : "—", C.text]} />

        <SectionTitle>{tab === "crypto" ? "Вероятност · 4H свещи" : "Вероятност · дневни свещи"}</SectionTitle>
        {hist.loading ? <Pad>Зареждам история от CLOB…</Pad>
          : hist.err ? <Pad color={C.red}>CLOB не върна история: {hist.err}</Pad>
          : hist.candles.length < 3 ? <Pad>Няма достатъчно история за този пазар.</Pad>
          : <Candles data={hist.candles} e9={e9} e21={e21} />}

        {hist.candles.length >= 15 && (
          <Row3
            a={["ТРЕНД EMA9/21", trend === "UP" ? "НАГОРЕ" : "НАДОЛУ", trend === "UP" ? C.green : C.red]}
            b={["RSI 14", r != null ? r.toFixed(0) : "—", r == null ? C.text : r > 70 ? C.red : r < 30 ? C.green : C.text]}
            c={["ДИАПАЗОН", (Math.min(...closes) * 100).toFixed(0) + "–" + (Math.max(...closes) * 100).toFixed(0) + "¢", C.text]}
          />
        )}

        {m.model != null ? (
          <>
            <SectionTitle>Количествен модел</SectionTitle>
            <div style={{ padding: "0 10px 8px" }}>
              <KV k="Актив / спот" v={`${m.asset} @ $${px(m.S)}`} />
              <KV k="Ниво в въпроса" v={`$${px(m.K)}`} />
              <KV k="Посока" v={isBelow(m.q) ? "под нивото" : "над нивото"} />
              <KV k="Тип" v={m.kind === "touch" ? "докосване по всяко време (бариера)" : "стойност на падеж"} />
              <KV k="Реализирана волатилност" v={pct(m.sigma, 0) + " год."} />
              <KV k="Хоризонт" v={(m.T * 365).toFixed(1) + " дни"} />
              <KV k="Моделна вероятност" v={pct(m.model)} color={C.cyan} />
              <KV k="Пазарна вероятност" v={pct(m.p)} color={C.amber} />
              <KV k="Edge" v={(m.edge > 0 ? "+" : "") + (m.edge * 100).toFixed(1) + " pp"} color={m.edge > 0.02 ? C.green : m.edge < -0.02 ? C.red : C.mute} />
              <KV k="Очаквана доходност" v={m.ev != null ? (m.ev > 0 ? "+" : "") + pct(m.ev, 1) : "—"} color={m.ev > 0 ? C.green : C.red} />
              <KV k="Kelly (пълен)" v={m.kelly != null && m.kelly > 0 ? pct(m.kelly, 1) + " от банката" : "0 — без позиция"} />
              <KV k="Kelly (½ — препоръчано)" v={m.kelly != null && m.kelly > 0 ? pct(m.kelly / 2, 1) + " от банката" : "0"} color={C.cyan} />
            </div>
          </>
        ) : (
          <Pad>Няма количествен модел за този пазар — не е ценови крипто въпрос с ясно ниво и срок. Оценявай по ликвидност, моментум и собствена информация.</Pad>
        )}

        <SectionTitle>План за сделка</SectionTitle>
        <div style={{ padding: "0 10px 14px" }}>
          <div style={{ background: C.panel2, border: `1px solid ${sig.side === "BUY YES" ? C.green : sig.side === "BUY NO" ? C.red : C.rule}`, padding: 9 }}>
            <div className="flex items-center justify-between">
              <div style={{ fontSize: 14, fontWeight: 700, color: sig.side === "BUY YES" ? C.green : sig.side === "BUY NO" ? C.red : C.mute }}>{sig.side}</div>
              <div style={{ fontSize: 10, color: C.mute }}>увереност {sig.conf}%</div>
            </div>
            <div style={{ marginTop: 7 }}>
              {sig.reasons.map((x, i) => (
                <div key={i} style={{ fontSize: 10, color: C.mute, lineHeight: 1.6 }}>· {x}</div>
              ))}
            </div>
            {sig.side !== "NEUTRAL" && (
              <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${C.rule}`, fontSize: 10, color: C.text, lineHeight: 1.7 }}>
                <div>Вход: лимит на {sig.side === "BUY YES" ? (m.p * 100).toFixed(0) + "¢ или по-добре" : ((1 - m.p) * 100).toFixed(0) + "¢ или по-добре"}</div>
                <div>Размер: {m.kelly > 0 ? pct(m.kelly / 2, 1) : "≤1%"} от банката, разбит на 2–3 транша</div>
                <div>Отказ от тезата: ако {sig.side === "BUY YES" ? "цената падне под " + Math.max(1, m.p * 100 - 8).toFixed(0) + "¢" : "цената скочи над " + Math.min(99, m.p * 100 + 8).toFixed(0) + "¢"} без промяна в модела</div>
                <div>Преоценка: при всяко движение на {m.asset || "актива"} над 3% или нова новина по темата</div>
              </div>
            )}
          </div>
          {s && (
            <div style={{ marginTop: 8, fontSize: 10, color: C.dim, lineHeight: 1.6 }}>
              {m.asset} спот ${px(s.price)} · 24ч {s.chg24 != null ? ((s.chg24 > 0 ? "+" : "") + pct(s.chg24, 1)) : "—"} · вол къса {pct(s.sigFast, 0)} / дълга {pct(s.sig, 0)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- primitives ---------- */
const SectionTitle = ({ children }) => (
  <div style={{ padding: "10px 10px 5px", fontSize: 10, color: C.amber, fontWeight: 700, letterSpacing: "0.05em" }}>{children}</div>
);
const Pad = ({ children, color }) => (
  <div style={{ padding: "10px", fontSize: 10, color: color || C.mute, lineHeight: 1.6 }}>{children}</div>
);
const KV = ({ k, v, color }) => (
  <div className="flex items-baseline justify-between" style={{ padding: "3px 0", borderBottom: `1px solid ${C.rule}` }}>
    <span style={{ fontSize: 10, color: C.mute }}>{k}</span>
    <span style={{ fontSize: 11, color: color || C.text, fontWeight: color ? 700 : 400 }}>{v}</span>
  </div>
);
const Row3 = ({ a, b, c }) => (
  <div className="flex" style={{ borderBottom: `1px solid ${C.rule}` }}>
    {[a, b, c].map(([l, v, col], i) => (
      <div key={i} style={{ flex: 1, padding: "7px 10px", borderRight: i < 2 ? `1px solid ${C.rule}` : "none" }}>
        <div style={{ fontSize: 9, color: C.dim }}>{l}</div>
        <div style={{ fontSize: 13, color: col, fontWeight: 700, marginTop: 2 }}>{v}</div>
      </div>
    ))}
  </div>
);

function Candles({ data, e9, e21 }) {
  const W = 360, H = 150, PL = 4, PR = 30, PT = 6, PB = 14;
  const d = data.slice(-70);
  const off = data.length - d.length;
  const lo = Math.min(...d.map((c) => c.l));
  const hi = Math.max(...d.map((c) => c.h));
  const pad = (hi - lo) * 0.08 || 0.02;
  const y0 = Math.max(0, lo - pad), y1 = Math.min(1, hi + pad);
  const Y = (v) => PT + (1 - (v - y0) / (y1 - y0)) * (H - PT - PB);
  const bw = (W - PL - PR) / d.length;
  const X = (i) => PL + i * bw + bw / 2;
  const line = (arr) => arr.slice(off).map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");

  return (
    <div style={{ padding: "0 6px" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {[y0, (y0 + y1) / 2, y1].map((v, i) => (
          <g key={i}>
            <line x1={PL} x2={W - PR} y1={Y(v)} y2={Y(v)} stroke={C.rule} strokeWidth="0.5" />
            <text x={W - PR + 3} y={Y(v) + 3} fill={C.dim} fontSize="8" fontFamily={MONO}>{(v * 100).toFixed(0)}¢</text>
          </g>
        ))}
        {d.map((c, i) => {
          const up = c.c >= c.o;
          const col = up ? C.green : C.red;
          const yo = Y(c.o), yc = Y(c.c);
          return (
            <g key={i}>
              <line x1={X(i)} x2={X(i)} y1={Y(c.h)} y2={Y(c.l)} stroke={col} strokeWidth="0.8" />
              <rect x={X(i) - Math.max(1, bw * 0.32)} y={Math.min(yo, yc)} width={Math.max(2, bw * 0.64)} height={Math.max(1, Math.abs(yc - yo))} fill={col} />
            </g>
          );
        })}
        {e9.length > off + 2 && <path d={line(e9)} fill="none" stroke={C.amber} strokeWidth="1" opacity="0.85" />}
        {e21.length > off + 2 && <path d={line(e21)} fill="none" stroke={C.cyan} strokeWidth="1" opacity="0.7" />}
      </svg>
      <div style={{ fontSize: 9, color: C.dim, padding: "2px 4px 8px" }}>
        <span style={{ color: C.amber }}>—</span> EMA9 &nbsp; <span style={{ color: C.cyan }}>—</span> EMA21 &nbsp; · {d.length} свещи
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PolymarketTerminal />);
</script>

<script>
window.addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && r.querySelector("#boot")) {
    r.innerHTML = '<div id="boot"><b>Polymarket Terminal</b><span>Грешка при стартиране: ' +
      String(e.message).replace(/</g, "&lt;") +
      '<br><br>Ако си отворил файла директно от диска, качи го на GitHub Pages или го пусни през локален сървър.</span></div>';
  }
});
</script>
